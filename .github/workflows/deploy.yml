name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # La suite corre antes del deploy: si algo falla, no se publica nada.
  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

  # Las reglas de privacidad viven en la base, así que también se prueban ahí: se levanta un
  # Supabase desechable dentro de esta máquina, se le aplican las migraciones de
  # supabase/migrations y se corren tests/db contra él. Nunca toca producción.
  db-test:
    runs-on: ubuntu-latest
    name: Database tests
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: latest

      - name: Start a throwaway Supabase with the migrations
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta

      - name: Run database tests
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY DB_URL
          python3 tests/db/run_all.py

  deploy:
    needs: [test, db-test]
    # Ramas y ejecuciones manuales solo prueban; publicar es solo desde main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Deploy
    environment:
      name: production
      url: https://fantomio.com

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Las variables NEXT_PUBLIC_* se incrustan en el bundle durante el build,
      # no se leen en ejecucion. Si faltan aca, el sitio se publica sin poder
      # conectarse a Supabase, aunque esten configuradas en Cloudflare.
      - name: Build static site
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Es pública a propósito; solo deja que el navegador envíe reportes de error.
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # IndexNow avisa a Bing (y a los demás buscadores que lo usan) qué páginas cambiaron, sin
      # esperar a que las vuelvan a rastrear. La clave es el archivo public/<clave>.txt. Si el
      # aviso falla no se cae el deploy: el sitemap sigue ahí.
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: |
          KEY=4eda86bb5eb5e3ace7418667e3c81f0c
          URLS=$(curl -s https://fantomio.com/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s -c .)
          curl -s -o /dev/null -w "IndexNow %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"fantomio.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://fantomio.com/$KEY.txt\",\"urlList\":$URLS}"
