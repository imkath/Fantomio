name: Keep Supabase alive

# El keep-alive PRINCIPAL es el Worker `ghostswap-keepalive` (ver keepalive/),
# que consulta la base cada 6 horas. Este workflow queda como red de seguridad:
# corre a diario y, si la base no responde, GitHub avisa por correo al duenio.
#
# Por que no basta con Actions: Supabase pide "a few user requests to the
# database each day over the previous week", y este workflow corria cada 3 dias,
# asi que la base se pauso igual en agosto de 2026. Ademas Actions deshabilita
# los workflows programados tras 60 dias sin actividad en el repo.
#
# Requiere dos secrets del repositorio (Settings > Secrets and variables > Actions):
#   SUPABASE_URL       -> https://<ref>.supabase.co
#   SUPABASE_ANON_KEY  -> la clave anon (publica por diseno, nunca la service_role)
#
# Nota de seguridad: este workflow no lee ningun dato del evento que lo dispara
# (titulos, mensajes de commit, etc.), por lo que no es vulnerable a inyeccion.
# Los unicos valores interpolados son secrets, y se pasan por env, no inline.

on:
  schedule:
    # 09:00 UTC todos los dias
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar la base para registrar actividad
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Faltan los secrets SUPABASE_URL o SUPABASE_ANON_KEY."
            exit 1
          fi

          # keepalive() hace una consulta real a Postgres, que es lo que Supabase
          # cuenta como actividad, y no devuelve datos de nadie. La clave anon no
          # puede leer tablas (migracion 20261026e). Responde 204 sin cuerpo.
          status="$(curl -s -o /tmp/body.txt -w '%{http_code}' --max-time 30 \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/keepalive" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" -d '{}')"

          echo "HTTP ${status}"

          if [ "${status}" != "204" ] && [ "${status}" != "200" ]; then
            echo "La base no respondio correctamente. Puede estar pausada."
            cat /tmp/body.txt
            exit 1
          fi

          echo "Proyecto activo."
